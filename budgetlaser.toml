# BudgetLaser v0.1 configuration. Every key is optional; these are the defaults.

[input]
sources = ["artnet"]       # any of artnet, sacn, usbpro; several are merged
artnet_universe = 0        # Art-Net port-address (QLC+ "universe 1" = 0)
sacn_universe = 1
serial_port = "/dev/ttyUSB0"
signal_loss = "blackout"   # blackout | hold
signal_timeout_s = 3.0

[output]
fullscreen = true
monitor = 0                # index in the monitor list (logged at start)
mapping = "fit"            # fit (square scan field centred) | stretch
line_width_px = 2.0
glow = true
glow_decay = 0.85          # per frame
dimmer_gamma = 2.2
internal_scale = 1.0       # 0.5 = render at half resolution (weak GPUs)
exposure = 1.0

# .ild playback: channel 2 = 180-199 plays a file, channel 12 picks it (0 = first .ild
# file in dir, sorted by name), channel 13 sets the speed (0 holds the first frame).
[ilda]
dir = "ilda"               # relative to this config file
frame_rate = 30.0          # frames per second at channel 13 = 128

# One block per virtual fixture (13, 14, 17 or 18 channels, see personality). Without
# any [[fixture]] block there is one fixture at address 1 filling the output. zone = [x, y, width, height] as fractions of
# the output, origin top-left; the scan field is placed in it according to output.mapping.
[[fixture]]
start_address = 1
personality = "13ch"       # 13ch | 17ch (fine channels 14-17) | 14ch, 18ch (13ch, 17ch + beam width)
zone = [0.0, 0.0, 1.0, 1.0]

# Two fixtures side by side:
# [[fixture]]
# start_address = 1
# zone = [0.0, 0.0, 0.5, 1.0]
# [[fixture]]
# start_address = 14
# zone = [0.5, 0.0, 0.5, 1.0]
